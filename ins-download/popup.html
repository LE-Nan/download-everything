<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; width: 220px; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #405de6; }
  input:checked + .slider:before { transform: translateX(18px); }
  button { width: 100%; padding: 7px 0; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; }
  button:hover { background: #f5f5f5; }
</style>
</head>
<body>
<h1>ins download</h1>
<div class="row">
  <span>启用下载按钮</span>
  <label class="switch">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
  </label>
</div>
<div class="row">
  <span>微博下载按钮</span>
  <label class="switch">
    <input type="checkbox" id="weiboEnabled">
    <span class="slider"></span>
  </label>
</div>
<button id="openOptions">打开设置</button>
<script src="popup.js"></script>
</body>
</html>
