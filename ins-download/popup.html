<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; width: 220px; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #405de6; }
  input:checked + .slider:before { transform: translateX(18px); }
  button { width: 100%; padding: 7px 0; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; }
  button:hover { background: #f5f5f5; }
  /* 站点链接：默认与普通文本一致，悬浮时才呈现"可跳转"的链接样式（变蓝 + 下划线） */
  .site-link { color: #222; text-decoration: none; cursor: pointer; }
  .site-link:hover { color: #405de6; text-decoration: underline; }
</style>
</head>
<body>
<h1>download-everything</h1>
<!-- 行内只写站点名（不再写「下载」），左侧文字点击跳站点，右侧开关仍只负责「是否在站点注入下载按钮」 -->
<div class="row">
  <a class="site-link" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" title="打开 Instagram" data-i18n-title="popup.openIg">Instagram</a>
  <label class="switch">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
  </label>
</div>
<div class="row">
  <a class="site-link" href="https://weibo.com" target="_blank" rel="noopener noreferrer" title="打开微博" data-i18n-title="popup.openWeibo" data-i18n="site.weibo">微博</a>
  <label class="switch">
    <input type="checkbox" id="weiboEnabled">
    <span class="slider"></span>
  </label>
</div>
<div class="row">
  <a class="site-link" href="https://x.com" target="_blank" rel="noopener noreferrer" title="打开 X（推特）" data-i18n-title="popup.openX" data-i18n="site.twitter">X（推特）</a>
  <label class="switch">
    <input type="checkbox" id="twitterEnabled">
    <span class="slider"></span>
  </label>
</div>
<button id="openOptions" data-i18n="popup.openOptions">打开设置</button>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
