<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ins download - 设置</title>
<style>
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; }
  select { width: 100%; padding: 6px 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  .dir-row { display: flex; align-items: center; gap: 8px; }
  .dir-display { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; background: #f7f7f7; font-size: 13px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { padding: 6px 12px; border: 1px solid #405de6; background: #fff; color: #405de6; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: #f0f3ff; }
  .btn.warn { border-color: #e67e22; color: #e67e22; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  #save { padding: 8px 20px; border: none; border-radius: 4px; background: #405de6; color: #fff; cursor: pointer; font-size: 14px; }
  #status { margin-left: 10px; color: #2ecc71; font-size: 13px; }
</style>
</head>
<body>
<h1>ins download 设置</h1>

<section>
  <h2>图片下载</h2>
  <label>图片保存位置</label>
  <div class="dir-row">
    <div class="dir-display" id="imageDirDisplay">默认（下载\ins-download\images）</div>
    <button class="btn" id="imagePick">选择文件夹</button>
    <button class="btn warn" id="imageReauth" style="display:none">重新授权</button>
    <button class="btn" id="imageReset" style="display:none">恢复默认</button>
  </div>
  <div class="hint">点击“选择文件夹”在弹出的系统窗口中挑选任意目录，之后图片静默下载到该目录，不再询问</div>
  <label for="imageQuality">图片分辨率</label>
  <select id="imageQuality">
    <option value="240">240P</option>
    <option value="480">480P</option>
    <option value="720">720P</option>
    <option value="1080">1080P</option>
    <option value="2k">2K</option>
    <option value="4k">4K</option>
  </select>
</section>

<section>
  <h2>视频下载</h2>
  <label>视频保存位置</label>
  <div class="dir-row">
    <div class="dir-display" id="videoDirDisplay">默认（下载\ins-download\videos）</div>
    <button class="btn" id="videoPick">选择文件夹</button>
    <button class="btn warn" id="videoReauth" style="display:none">重新授权</button>
    <button class="btn" id="videoReset" style="display:none">恢复默认</button>
  </div>
  <div class="hint">与图片目录独立设置，互不影响</div>
  <label for="videoQuality">视频清晰度</label>
  <select id="videoQuality">
    <option value="240">240P</option>
    <option value="480">480P</option>
    <option value="720">720P</option>
    <option value="1080">1080P</option>
    <option value="2k">2K</option>
    <option value="4k">4K</option>
  </select>
  <div class="hint">视频以 Instagram 实际提供的流为准，会优先匹配所选清晰度</div>
</section>

<button id="save">保存</button><span id="status"></span>
<script src="idb.js"></script>
<script src="options.js"></script>
</body>
</html>
